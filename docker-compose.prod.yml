services:
  pdfconverter:
    image: ${PDFCONVERTER_IMAGE}
    container_name: pdfconverter
    restart: unless-stopped
    ports:
      - "9013:9013"
    environment:
      MAX_FILE_SIZE_MB: "300"
      MAX_FILE_COUNT: "100"
      MAX_TOTAL_UPLOAD_SIZE_GB: "5"
      MAX_CONCURRENT_JOBS: "4"
      RETENTION_DAYS: "3"
      STORAGE_DIR: "/app/storage"
    volumes:
      - ./data/storage:/app/storage
